<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vidor - AI Video Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Vidora AI</span>
    </div>
    <button class="icon-btn" id="settingsBtn" type="button" title="Backend settings" aria-label="Backend settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 13a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V19a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 13a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 6.09a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 1.6a1.7 1.7 0 0 0 1-1.55V0"/>
      </svg>
    </button>
  </header>

  <div class="layout">

    <aside class="rail">
      <section class="submit-card" aria-label="Load a video">
        <div class="tabs" role="tablist">
          <button class="tab active" role="tab" aria-selected="true" data-tab="url" type="button">YouTube URL</button>
          <button class="tab" role="tab" aria-selected="false" data-tab="upload" type="button">Upload file</button>
        </div>

        <div class="tab-panel" data-panel="url">
          <label class="field-label" for="urlInput">Video URL</label>
          <input class="text-input" type="url" id="urlInput" placeholder="https://www.youtube.com/watch?v=&hellip;" autocomplete="off" />
        </div>

        <div class="tab-panel" data-panel="upload" hidden>
          <label class="field-label" for="fileInput">Video or audio file</label>
          <label class="dropzone" id="dropzone" for="fileInput">
            <input type="file" id="fileInput" accept="video/*,audio/*" hidden />
            <svg class="dz-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M12 16V4M12 4l-4 4M12 4l4 4"/>
              <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
            </svg>
            <span class="dz-text">Drop a file here, or click to browse</span>
            <span class="dz-filename" id="dzFilename"></span>
          </label>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" id="translateCheckbox" />
          <span>Translate to English</span>
        </label>

        <details class="advanced">
          <summary>Advanced</summary>
          <label class="field-label" for="chunkMinutes">Chunk length (minutes)</label>
          <input class="text-input small" type="number" id="chunkMinutes" min="1" max="60" placeholder="Server default" />
        </details>

        <button class="btn btn-primary btn-block" id="submitBtn" type="button">
          <span class="btn-label">Process video</span>
        </button>
      </section>

      <div class="rail-list-head">
        <span>Videos</span>
        <span class="rail-count" id="railCount">0</span>
      </div>

      <div class="rail-list" id="videoList">
        <div class="rail-empty">No videos yet. Load one above.</div>
      </div>
    </aside>

    <main class="deck" id="deck">
      <div class="deck-empty">
        <div class="vu-meter large idle" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <h2>Nothing selected</h2>
        <p>Paste a YouTube URL or upload a file on the left to get a transcript, a summary, and an assistant that can answer questions about it.</p>
      </div>
    </main>

  </div>
</div>

<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<div class="modal-overlay" id="settingsOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h3 id="settingsTitle">Backend address</h3>
    <p class="modal-hint">The base URL where your FastAPI backend is running.</p>
    <input class="text-input" type="text" id="apiBaseInput" placeholder="http://127.0.0.1:8000" />
    <div class="modal-actions">
      <button class="btn btn-ghost" id="apiBaseCancel" type="button">Cancel</button>
      <button class="btn btn-primary" id="apiBaseSave" type="button">Save</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
